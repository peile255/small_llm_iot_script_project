seed: 42
data:
  processed_dir: data/processed/final_frozen
  train_file: final_train.csv
  val_file: final_val.csv
  test_file: final_test.csv
  mixed_file: mixed_test.csv
  external_malicious_file: external_malicious.csv
  max_file_bytes: 500000
  split:
    train: 0.7
    val: 0.1
    test: 0.2
prompt:
  output_format: json
  mode: zero_shot
  max_input_tokens: 3072
  max_new_tokens: 40
  long_file_mode: head_tail
  chunk_overlap_tokens: 128
  few_shot_per_class: 2
inference:
  load_in_4bit: false
  device_map: auto
  torch_dtype: auto
  batch_size: 1
  temperature: 0.0
  do_sample: false
models:
  qwen2_7b:
    hf_id: Qwen/Qwen2-7B-Instruct
    display_name: Qwen2-7B-Instruct
    trust_remote_code: false
  mistral_7b:
    hf_id: mistralai/Mistral-7B-Instruct-v0.3
    display_name: Mistral-7B-Instruct-v0.3
    trust_remote_code: false
  phi3_mini:
    hf_id: microsoft/Phi-3-mini-4k-instruct
    display_name: Phi-3-mini-4k-instruct
    trust_remote_code: true
baseline:
  char_ngram_range:
  - 3
  - 5
  max_features: 200000
  C: 2.0
  class_weight: balanced
bootstrap:
  n_resamples: 2000
  confidence_level: 0.95
